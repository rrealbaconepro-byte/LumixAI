<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumixAI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.app{
    width:390px;
    height:700px;
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    border:1px solid #334155;
}

.header{
    background:#2563eb;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.newChat{
    background:white;
    color:#2563eb;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg{
    max-width:80%;
    padding:12px;
    border-radius:12px;
    color:white;
    word-wrap:break-word;
}

.user{
    align-self:flex-end;
    background:#2563eb;
}

.ai{
    align-self:flex-start;
    background:#1f2937;
}

.footer{
    display:flex;
    padding:10px;
    background:#0b1220;
}

input{
    flex:1;
    padding:12px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#1e293b;
    color:white;
}

button.send{
    margin-left:8px;
    padding:12px 16px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🤖 LumixAI</div>
        <button class="newChat" onclick="newChat()">+ New Chat</button>
    </div>

    <div id="chat" class="chat"></div>

    <div class="footer">
        <input id="message" placeholder="Message LumixAI...">
        <button class="send" onclick="send()">Send</button>
    </div>

</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");

function addMessage(text,type){
    const div=document.createElement("div");
    div.className="msg "+type;
    div.textContent=text;
    chat.appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}

function send(){
    const text=input.value.trim();
    if(text==="") return;

    addMessage(text,"user");
    input.value="";

    setTimeout(()=>{
        addMessage("LumixAI: "+text,"ai");
    },500);
}

function newChat(){
    chat.innerHTML="";
}

input.addEventListener("keydown",function(e){
    if(e.key==="Enter") send();
});
</script>

</body>
</html>
