<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumixAI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;height:100vh;display:flex;justify-content:center;align-items:center}
.app{width:390px;height:700px;background:#111827;border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
header{background:#2563eb;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
#chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:12px;max-width:80%;color:#fff}
.user{background:#2563eb;align-self:end}
.ai{background:#1f2937}
img.chatimg{width:180px;border-radius:12px;margin-top:6px}
footer{display:flex;padding:10px;background:#0b1220;gap:8px}
input[type=text]{flex:1;padding:12px;border:none;border-radius:10px;background:#1e293b;color:#fff}
button{padding:12px;border:none;border-radius:10px;background:#2563eb;color:#fff;cursor:pointer}
label{background:#374151;padding:12px;border-radius:10px;cursor:pointer}
#file{display:none}
</style>
</head>
<body>

<div class="app">
<header>
<b>🤖 LumixAI</b>
<button onclick="newChat()">New</button>
</header>

<div id="chat"></div>

<footer>
<label for="file">📷</label>
<input id="file" type="file" accept="image/*">
<input id="text" type="text" placeholder="Message LumixAI...">
<button onclick="send()">Send</button>
</footer>
</div>

<script>
const chat=document.getElementById("chat");
const text=document.getElementById("text");
const file=document.getElementById("file");

function bubble(content,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 if(typeof content==="string") div.textContent=content;
 else div.appendChild(content);
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

async function send(){
 const msg=text.value.trim();
 const img=file.files[0];

 if(!msg && !img) return;

 if(msg) bubble(msg,"user");

 if(img){
   const image=document.createElement("img");
   image.src=URL.createObjectURL(img);
   image.className="chatimg";
   bubble(image,"user");
 }

 const form=new FormData();
 form.append("message",msg);
 if(img) form.append("image",img);

 const res=await fetch("/chat",{method:"POST",body:form});
 const data=await res.json();

 bubble(data.reply,"ai");

 text.value="";
 file.value="";
}

function newChat(){
 chat.innerHTML="";
}

text.addEventListener("keydown",e=>{
 if(e.key==="Enter") send();
});
</script>

</body>
</html>
